name: collect

on:
  schedule:  # co 2 h; skrypt wybiera lotnisko (lcjfares/schedule.py) — opóźnione/pominięte runy nadrabia następny
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      airport:
        description: "Lotnisko (auto = jak cron: najdawniej mierzone)"
        type: choice
        options: [auto, LCJ, KTW, WRO, WMI, BZG]
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: home
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.airport }}" != "auto" ]; then
            H="${{ inputs.airport }}"
          else
            H=$(python -m lcjfares.schedule data)
          fi
          echo "home=$H" >> "$GITHUB_OUTPUT"
          echo "Lotnisko: ${H:-brak — wszystkie zmierzone w ciągu 18 h}"
      - name: Public IP
        if: steps.home.outputs.home != ''
        run: |
          echo "Publiczne IP runnera: $(curl -s --max-time 5 ifconfig.me || echo '?')"
      - run: pip install -r requirements.txt
        if: steps.home.outputs.home != ''
      - run: pytest -q
        if: steps.home.outputs.home != ''
      - id: collect
        if: steps.home.outputs.home != ''
        run: python -m lcjfares.collect ${{ steps.home.outputs.home }}
        continue-on-error: true
      # dane commitujemy od razu — błąd analizy nie może zgubić dnia pomiarów
      - name: Commit data
        if: steps.home.outputs.home != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/${{ steps.home.outputs.home }}
          git diff --cached --quiet || git commit -m "data: ${{ steps.home.outputs.home }} $(date -u +%F)"
          git pull --rebase
          git push
      - run: python -m lcjfares.analyze ${{ steps.home.outputs.home }}
        if: steps.home.outputs.home != ''
      - name: Commit site data
        if: steps.home.outputs.home != ''
        run: |
          git add site/data/${{ steps.home.outputs.home }}.json
          git diff --cached --quiet || git commit -m "site: ${{ steps.home.outputs.home }} $(date -u +%F)"
          git pull --rebase
          git push
      - uses: actions/configure-pages@v5
        if: steps.home.outputs.home != ''
      - uses: actions/upload-pages-artifact@v3
        if: steps.home.outputs.home != ''
        with:
          path: site
      - id: deploy
        if: steps.home.outputs.home != ''
        uses: actions/deploy-pages@v4
      - name: Fail if collection failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
