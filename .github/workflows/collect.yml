name: collect

on:
  schedule:  # co 2 h; lcjfares/schedule.py podaje czekające lotniska — GitHub część runów pomija, następny nadrabia
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      airport:
        description: "Lotnisko (auto = jak cron: najdawniej mierzone)"
        type: choice
        options: [auto, LCJ, KTW, WRO, WMI, BZG]
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: home
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.airport }}" != "auto" ]; then
            H="${{ inputs.airport }}"
          else
            H=$(python -m lcjfares.schedule data)
          fi
          echo "homes=$H" >> "$GITHUB_OUTPUT"
          echo "Lotniska: ${H:-brak — wszystkie zmierzone w ciągu 18 h}"
      - name: Public IP
        if: steps.home.outputs.homes != ''
        run: |
          echo "Publiczne IP runnera: $(curl -s --max-time 5 ifconfig.me || echo '?')"
      - run: pip install -r requirements.txt
        if: steps.home.outputs.homes != ''
      - run: pytest -q
        if: steps.home.outputs.homes != ''
      # po kolei każde czekające lotnisko; dane commitujemy zaraz po zbiorze (błąd dalej nie zgubi pomiaru)
      - id: run
        name: Collect + analyze
        if: steps.home.outputs.homes != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          start=$(date +%s); failed=""
          for H in ${{ steps.home.outputs.homes }}; do
            if [ $(( $(date +%s) - start )) -gt 3300 ]; then   # nie zaczynaj nowego po 55 min — reszta w następnym runie
              echo "budżet czasu wyczerpany — $H w następnym uruchomieniu"; continue
            fi
            echo "::group::$H"
            python -m lcjfares.collect "$H" || failed="$failed $H"
            git add "data/$H"
            git diff --cached --quiet || git commit -m "data: $H $(date -u +%F)"
            git pull --rebase && git push
            python -m lcjfares.analyze "$H"
            git add "site/data/$H.json"
            git diff --cached --quiet || git commit -m "site: $H $(date -u +%F)"
            git pull --rebase && git push
            echo "::endgroup::"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.home.outputs.homes != ''
      - uses: actions/upload-pages-artifact@v3
        if: steps.home.outputs.homes != ''
        with:
          path: site
      - id: deploy
        if: steps.home.outputs.homes != ''
        uses: actions/deploy-pages@v4
      - name: Fail if collection failed
        if: steps.run.outputs.failed != ''
        run: |
          echo "nieudany zbiór:${{ steps.run.outputs.failed }}"; exit 1
